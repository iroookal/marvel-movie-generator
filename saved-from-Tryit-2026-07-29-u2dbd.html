<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Marvel Movie Picker</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, Helvetica, sans-serif;
}

body{
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0b1026,#8b0000);
}

.container{
    width:90%;
    max-width:600px;
    background:rgba(255,255,255,0.1);
    backdrop-filter:blur(15px);
    border-radius:25px;
    padding:40px;
    text-align:center;
    color:white;
    box-shadow:0 15px 35px rgba(0,0,0,.4);
}

h1{
    font-size:2.3rem;
    margin-bottom:15px;
}

p{
    opacity:.8;
    margin-bottom:30px;
}

button{
    padding:15px 35px;
    border:none;
    border-radius:40px;
    background:#e62429;
    color:white;
    font-size:1.1rem;
    cursor:pointer;
    transition:.3s;
}

button:hover{
    transform:scale(1.08);
    background:#ff3c41;
}

.movie{
    margin-top:35px;
    font-size:1.8rem;
    font-weight:bold;
    min-height:60px;
    animation:fade .4s;
}

@keyframes fade{
    from{
        opacity:0;
        transform:translateY(15px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}
</style>
</head>

<body>

<div class="container">

<h1>🎬 Marvel Movie Picker</h1>

<p>Can't decide what to watch?</p>

<button onclick="pickMovie()">Pick a Movie</button>

<div id="movie" class="movie"></div>

</div>

<script>

const movies = [

"Iron Man (2008)",
"The Incredible Hulk (2008)",
"Iron Man 2 (2010)",
"Thor (2011)",
"Captain America: The First Avenger (2011)",
"The Avengers (2012)",
"Iron Man 3 (2013)",
"Thor: The Dark World (2013)",
"Captain America: The Winter Soldier (2014)",
"Guardians of the Galaxy (2014)",
"Avengers: Age of Ultron (2015)",
"Ant-Man (2015)",
"Captain America: Civil War (2016)",
"Doctor Strange (2016)",
"Guardians of the Galaxy Vol. 2 (2017)",
"Spider-Man: Homecoming (2017)",
"Thor: Ragnarok (2017)",
"Black Panther (2018)",
"Avengers: Infinity War (2018)",
"Ant-Man and the Wasp (2018)",
"Captain Marvel (2019)",
"Avengers: Endgame (2019)",
"Spider-Man: Far From Home (2019)",
"Black Widow (2021)",
"Shang-Chi and the Legend of the Ten Rings (2021)",
"Eternals (2021)",
"Spider-Man: No Way Home (2021)",
"Doctor Strange in the Multiverse of Madness (2022)",
"Thor: Love and Thunder (2022)",
"Black Panther: Wakanda Forever (2022)",
"Ant-Man and the Wasp: Quantumania (2023)",
"Guardians of the Galaxy Vol. 3 (2023)",
"The Marvels (2023)",
"Deadpool & Wolverine (2024)",
"Captain America: Brave New World (2025)",
"Thunderbolts* (2025)",
"The Fantastic Four: First Steps (2025)",
"Spider-Man: Brand New Day (2026)

];

function pickMovie(){

const random = Math.floor(Math.random()*movies.length);

document.getElementById("movie").textContent = movies[random];

}

</script>

</body>
</html>
